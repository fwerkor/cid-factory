[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cid-factory"
version = "0.2.0"
description = "A polished WebUI and thin launcher for Continuous Interaction Diffusion."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Yuhang Cao"}]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
cid-factory = "cid_factory.cli:main"

[project.urls]
Repository = "https://github.com/fwerkor/cid-factory"
CID = "https://github.com/fwerkor/continuous-interaction-diffusion"

[tool.hatch.build.targets.wheel]
packages = ["src/cid_factory"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "cid_factory/web"

[tool.hatch.build.targets.sdist.force-include]
"web/dist" = "web/dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
